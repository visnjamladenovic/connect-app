version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: connect_app
    volumes:
      - ./src:/var/www/html
    networks:
      - connect_network

  webserver:
    image: nginx:alpine
    container_name: connect_nginx
    ports:
      - "8090:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - connect_network

  db:
    image: postgres:16
    container_name: connect_db
    restart: always
    environment:
      POSTGRES_DB: connect
      POSTGRES_USER: connect_user
      POSTGRES_PASSWORD: connect_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - connect_network

volumes:
  db_data:

networks:
  connect_network:
    driver: bridge